<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 to Thermal Printer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    h1 {
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
    }

    button {
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
    }

    #preview {
      margin-top: 20px;
      background: white;
      overflow: auto;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>A4 → Thermal Printer</h1>

  <input type="file" id="fileInput" accept="image/*,.pdf">

  <button onclick="printPage()">Print</button>

  <div id="preview"></div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

let image = null;

fileInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  if (file.type.startsWith("image/")) {

    const reader = new FileReader();

    reader.onload = function(e) {

      image = new Image();

      image.onload = function() {

        preview.innerHTML = "";
        preview.appendChild(image);

        image.style.width = "100%";
      };

      image.src = e.target.result;
    };

    reader.readAsDataURL(file);

  } else {

    alert("For now, select an image file. PDF support will be added next.");

  }

});


function printPage() {

  if (!image) {
    alert("Please select an image first.");
    return;
  }

  const printWindow = window.open("", "_blank");

  printWindow.document.write(`
    <html>
    <head>

      <style>

        @page {
          size: auto;
          margin: 0;
        }

        body {
          margin: 0;
          padding: 0;
        }

        img {
          width: 100%;
          height: auto;
          display: block;
        }

      </style>

    </head>

    <body>

      <img src="${image.src}">

      <script>

        window.onload = function() {
          window.print();
        };

      <\/script>

    </body>
    </html>
  `);

  printWindow.document.close();

}

</script>

</body>
</html>
