<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Thermal Print Tool</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#eee;
  font-family:Arial,sans-serif;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:12px;
}

h1{
  text-align:center;
  font-size:28px;
}

textarea{
  width:100%;
  min-height:160px;
  padding:12px;
  font-size:18px;
  resize:vertical;
  border:1px solid #aaa;
  border-radius:6px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

button,input{
  width:100%;
  padding:13px;
  margin-top:10px;
  font-size:16px;
}

button{
  background:#000;
  color:white;
  border:0;
  border-radius:6px;
}

.preview{
  width:48mm;
  margin:20px auto;
  background:white;
  color:black;
  overflow-wrap:break-word;
}

.previewText{
  white-space:pre-wrap;
  font-size:18px;
  line-height:1.25;
  text-align:left;
}

.preview img{
  display:block;
  width:48mm;
  height:auto;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="box">

<h1>🖨️ Thermal Print</h1>

<label><b>Write what you want to print:</b></label>

<textarea id="text"
placeholder="Type your text here...

Example:
DESANDH POST OFFICE
SB ACCOUNT
PPF
RPLI
Contact: 1234567890"></textarea>

<div class="controls">

<button onclick="setAlign('left')">⬅ Left</button>
<button onclick="setAlign('center')">↔ Center</button>

<button onclick="makeBold()">B Bold</button>
<button onclick="changeSize()">A+ Size</button>

</div>

<label><b>Add an image/document:</b></label>

<input
type="file"
id="file"
accept="image/*">

<div id="preview" class="preview">

<div id="previewText" class="previewText">
</div>

</div>

<button onclick="printThermal()">
🖨️ PRINT
</button>

</div>

<script>

const textBox=document.getElementById("text");
const previewText=document.getElementById("previewText");
const fileInput=document.getElementById("file");
const preview=document.getElementById("preview");

let bold=false;
let fontSize=18;
let align="left";

function updatePreview(){

previewText.textContent=textBox.value;

previewText.style.fontWeight=
bold ? "bold" : "normal";

previewText.style.fontSize=
fontSize+"px";

previewText.style.textAlign=align;

}

textBox.addEventListener("input",updatePreview);

function setAlign(value){

align=value;
updatePreview();

}

function makeBold(){

bold=!bold;
updatePreview();

}

function changeSize(){

fontSize+=2;

if(fontSize>30){
fontSize=14;
}

updatePreview();

}

fileInput.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){
alert("Please select an image.");
return;
}

const reader=new FileReader();

reader.onload=function(e){

let old=document.getElementById("printImage");

if(old)old.remove();

const img=document.createElement("img");

img.id="printImage";
img.src=e.target.result;

preview.appendChild(img);

};

reader.readAsDataURL(file);

});

function printThermal(){

if(!textBox.value.trim() && !document.getElementById("printImage")){

alert("Please type something or select an image.");

return;

}

const printWindow=window.open("","_blank");

const text=previewText.outerHTML;

const img=document.getElementById("printImage");

const imageHTML=img
? `<img src="${img.src}">`
: "";

printWindow.document.write(`

<html>

<head>

<style>

@page{
size:48mm auto;
margin:0;
}

html,body{
margin:0;
padding:0;
width:48mm;
}

body{
font-family:Arial,sans-serif;
color:#000;
}

.printArea{
width:48mm;
padding:2mm;
}

img{
display:block;
width:44mm;
height:auto;
margin-top:2mm;
}

</style>

</head>

<body>

<div class="printArea">

${text}

${imageHTML}

</div>

<script>

window.onload=function(){

setTimeout(function(){

window.print();

},500);

};

<\/script>

</body>

</html>

`);

printWindow.document.close();

}

updatePreview();

</script>

</body>
</html>
